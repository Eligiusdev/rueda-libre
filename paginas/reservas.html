        <!-- Sección de Formulario con Validación Nativa (MiniReto 7) -->
        <section>
            <h2>Formulario de reserva</h2>
            <p>Completa los siguientes datos para procesar el préstamo de tu equipamiento de manera automática:</p>
            
            <form action="#" method="POST">
                
                <!-- GRUPO 1: Tus datos -->
                <fieldset>
                    <legend>Tus datos</legend>
                    
                    <div>
                        <label for="nombre">Nombre completo *:</label>
                        <input type="text" id="nombre" name="cliente_nombre" required minlength="3" placeholder="Ej. Juan Pérez">
                    </div>

                    <div>
                        <label for="documento">Número de documento *:</label>
                        <input type="text" id="documento" name="cliente_documento" required pattern="^[0-9]{6,10}$" title="El documento debe contener solo números entre 6 y 10 dígitos." placeholder="Solo números (6-10 dígitos)">
                    </div>

                    <div>
                        <label for="correo">Correo electrónico *:</label>
                        <input type="email" id="correo" name="cliente_correo" required placeholder="ejemplo@correo.com">
                    </div>

                    <div>
                        <label for="celular">Celular *:</label>
                        <input type="tel" id="celular" name="cliente_celular" required pattern="^3[0-9]{9}$" title="El celular debe tener 10 dígitos y empezar estrictamente por el número 3." placeholder="Ej. 3001234567">
                    </div>
                </fieldset>

                <br>

                <!-- GRUPO 2: Tu alquiler -->
                <fieldset>
                    <legend>Tu alquiler</legend>

                    <div>
                        <label for="fecha">Fecha del alquiler *:</label>
                        <input type="date" id="fecha" name="alquiler_fecha" required min="2026-11-01" max="2026-12-31">
                    </div>

                    <div class="opciones-bici">
                        <span class="label-falso" id="grupo-bici">Tipo de bicicleta *:</span>
                        
                        <input type="radio" id="bici-urbana" name="tipo_bicicleta" value="urbana" required>
                        <label for="bici-urbana">Urbana</label>

                        <input type="radio" id="bici-montana" name="tipo_bicicleta" value="montaña">
                        <label for="bici-montana">Montaña</label>

                        <input type="radio" id="bici-electrica" name="tipo_bicicleta" value="eléctrica">
                        <label for="bici-electrica">Eléctrica</label>
                    </div>

                    <div>
                        <label for="plan">Plan de alquiler *:</label>
                        <select id="plan" name="plan_alquiler" required>
                            <option value="" disabled selected>-- Elige un plan --</option>
                            <option value="1_hora">1 hora</option>
                            <option value="medio_dia">Medio día (4 h)</option>
                            <option value="dia_completo">Día completo</option>
                        </select>
                    </div>

                    <div>
                        <label for="cantidad">Cantidad de bicicletas *:</label>
                        <input type="number" id="cantidad" name="cantidad_bicicletas" required min="1" max="6" value="1">
                    </div>

                    <div>
                        <label for="recorrido">Recorrido guiado:</label>
                        <select id="recorrido" name="recorrido_guiado">
                            <option value="ninguno">Ninguno (Alquiler libre)</option>
                            <option value="rio_parques">Río y Parques</option>
                            <option value="sabores_barrio">Sabores de Barrio</option>
                            <option value="reto_palmas">Reto Las Palmas</option>
                        </select>
                    </div>
                </fieldset>

                <br>

                <!-- GRUPO 3: Confirmación -->
                <fieldset>
                    <legend>Confirmación</legend>

                    <div>
                        <label for="comentarios">Comentarios o solicitudes especiales (Opcional):</label><br>
                        <textarea id="comentarios" name="comentarios_adicionales" maxlength="300" rows="4" cols="40" placeholder="Máximo 300 caracteres..."></textarea>
                    </div>

                    <div class="politicas">
                        <input type="checkbox" id="politicas" name="aceptacion_politicas" value="aceptado" required>
                        <label for="politicas">Acepto las políticas de alquiler de bicicletas y condiciones de seguridad *.</label>
                    </div>
                </fieldset>

                <br>

                <!-- Botón de envío obligatorio -->
                <div>
                    <button type="submit">Enviar Reserva</button>
                </div>

            </form>
        </section>
